name: Publish OrbitInfluences 1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package
        run: |
          test -s GameData/OrbitInfluences/Plugins/OrbitInfluences.dll
          test -s GameData/OrbitInfluences/OrbitInfluences.cfg
          mkdir -p dist
          zip -q -r dist/OrbitInfluences-1.0.0.zip GameData/OrbitInfluences README.md CHANGELOG.md LICENSE -x '*/PluginData/*'
          unzip -t dist/OrbitInfluences-1.0.0.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 dist/OrbitInfluences-1.0.0.zip --target "$GITHUB_SHA" --title "OrbitInfluences 1.0.0" --notes-file RELEASE_NOTES.md
